# fly.toml app configuration file.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# NOTE: `app` must match an app that exists on your Fly account — run
# `fly apps create <name>` (or `fly launch`) before the first deploy.

app = 'sigh-settle-api'
primary_region = 'ord'

[build]
  dockerfile = './Dockerfile'

[env]
  # Must agree with `internal_port` below and `EXPOSE` in the Dockerfile.
  # The local default in src/env.ts is a development port — do not use it here.
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
